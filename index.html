<style>
:root{
  --bg:#F6F5FC; --surface:#FFFFFF; --sunk:#F0EEFA; --ink:#1B1640; --muted:#5D5781; --line:#E1DCF4;
  --violet:#6B3FF2; --violet-ink:#4B23CC; --violet-soft:#EEE8FF;
  --turq:#12AE9F; --turq-ink:#0B6F66; --turq-soft:#DCF5F1;
  --warn:#A44A12; --warn-soft:#FDEEE2; --ok:#0B7F62;
  --hero-bg:#5B2EE6; --hero-ink:#FFFFFF; --hero-muted:#DCD2FF;
  --l1:#DCD0FF; --l2:#BBA4FF; --l3:#9575FB; --l4:#6B3FF2; --l5:#4D25CF; --l6:#3412A3;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Sora","Inter",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121027; --surface:#1B1736; --sunk:#16132D; --ink:#EDEAFF; --muted:#A7A1CB; --line:#2E2856;
    --violet:#9C7DFF; --violet-ink:#BCA6FF; --violet-soft:#271F4F;
    --turq:#3BD6C6; --turq-ink:#6FE6DA; --turq-soft:#13383A;
    --warn:#F2A26B; --warn-soft:#3A2416; --ok:#4FD1A8;
    --hero-bg:#2A1A72; --hero-ink:#F4F1FF; --hero-muted:#CFC6F5;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121027; --surface:#1B1736; --sunk:#16132D; --ink:#EDEAFF; --muted:#A7A1CB; --line:#2E2856;
  --violet:#9C7DFF; --violet-ink:#BCA6FF; --violet-soft:#271F4F;
  --turq:#3BD6C6; --turq-ink:#6FE6DA; --turq-soft:#13383A;
  --warn:#F2A26B; --warn-soft:#3A2416; --ok:#4FD1A8;
  --hero-bg:#2A1A72; --hero-ink:#F4F1FF; --hero-muted:#CFC6F5;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);line-height:1.2;margin:0;letter-spacing:-.01em}
p{margin:0 0 .8em}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--turq);outline-offset:2px;border-radius:6px}

/* top bar */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px clamp(16px,4vw,40px);background:var(--hero-bg);color:var(--hero-ink)}
.brand{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.02em}
.brand small{font-family:var(--sans);font-weight:500;font-size:13px;opacity:.85;margin-left:10px;letter-spacing:0}
.bar .sp{flex:1}
.seg{display:inline-flex;border:1px solid color-mix(in srgb,var(--hero-ink) 35%,transparent);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--hero-ink);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--hero-ink);color:var(--hero-bg)}
.barbtn{border:1px solid color-mix(in srgb,var(--hero-ink) 35%,transparent);background:transparent;color:var(--hero-ink);padding:7px 14px;border-radius:999px;font-size:13px;font-weight:500}
.barbtn:hover{background:color-mix(in srgb,var(--hero-ink) 12%,transparent)}

/* hero */
.hero{background:var(--hero-bg);color:var(--hero-ink);padding:clamp(28px,5vw,64px) clamp(16px,4vw,40px) clamp(32px,5vw,56px);display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:clamp(24px,4vw,56px);align-items:end}
.hero .aud{font-size:14px;font-weight:600;color:var(--hero-muted);margin-bottom:14px}
.hero h1{font-size:clamp(34px,5.4vw,62px);font-weight:800;letter-spacing:-.035em;max-width:14ch}
.hero .sub{font-size:clamp(16px,1.6vw,19px);color:var(--hero-muted);max-width:56ch;margin:18px 0 0}
.hero .facts{margin-top:22px;font-size:14px;color:var(--hero-ink);display:flex;flex-wrap:wrap;gap:8px}
.hero .facts span{border:1px solid color-mix(in srgb,var(--hero-ink) 30%,transparent);border-radius:999px;padding:5px 12px}
.live{background:var(--surface);color:var(--ink);border-radius:18px;padding:18px 18px 14px;box-shadow:0 20px 50px -24px rgba(20,8,70,.55)}
.live h2{font-size:15px;font-weight:700;margin-bottom:12px}
.mx{display:grid;grid-template-columns:minmax(90px,1.3fr) repeat(var(--n),minmax(0,1fr));gap:4px;font-size:12px}
.mx .hd{font-weight:600;color:var(--muted);text-align:center;padding-bottom:2px}

/* layout */

/* step */

.prose ul,.prose ol{padding-left:1.2em;margin:0 0 1em}

.map{width:100%;border-collapse:collapse;margin:8px 0 18px;font-size:15px}

.ex{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:6px;margin:8px 0 6px}

/* workbench */
.wb{margin:28px 0;padding:clamp(18px,3vw,26px);background:var(--surface);border:1px solid var(--line);border-radius:16px;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:18px 18px;background-position:-9px -9px}

.f{display:block;margin:0 0 12px}

.in,textarea.in,select.in{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px}

.model{display:flex;flex-direction:column;gap:6px;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.45}
.model:hover{border-color:var(--violet)}
.model[data-v="hibrido"]{grid-column:1/-1;border-style:dashed}

.model .mn{font-family:var(--display);font-weight:700;font-size:16px;display:flex;justify-content:space-between;gap:8px}
.model .mn i{font-style:normal;font-size:12px;font-weight:600;color:#fff;background:var(--violet);border-radius:999px;padding:2px 9px;visibility:hidden;white-space:nowrap;align-self:flex-start}

.model .md{color:var(--ink)}
.model .mc,.model .me{color:var(--muted);font-size:13.5px}
.model b{font-weight:600;color:var(--ink)}
.msel{padding:16px;border-radius:12px;background:var(--sunk);margin-top:4px}
.msel h4{font-size:16px;margin-bottom:6px}
.msel p{font-size:15px}
.m-semaforo{--l1:#F3A29D;--l2:#F5D05E;--l3:#62CC95}
.m-semaforo .lv1,.m-semaforo .lv2,.m-semaforo .lv3{color:#1B1640}

@media (max-width:620px){.models{grid-template-columns:1fr}}
.presets{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;font-size:14px;color:var(--muted)}

.lvn{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px}
.lvb{flex:1;display:grid;gap:6px}
.lv1{background:var(--l1);color:#1B1640}.lv2{background:var(--l2);color:#1B1640}.lv3{background:var(--l3);color:#fff}
.lv4{background:var(--l4);color:#fff}.lv5{background:var(--l5);color:#fff}.lv6{background:var(--l6);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}

.comp{padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--surface)}
.comp-top{display:grid;grid-template-columns:1.3fr 1fr auto;gap:8px;margin-bottom:8px}
.badge{display:inline-block;margin-top:6px;font-size:12px;font-weight:600;color:var(--turq-ink);background:var(--turq-soft);padding:2px 8px;border-radius:999px}
.perfil{padding:16px;border:1px solid var(--line);border-radius:14px;margin-bottom:14px;background:var(--surface)}
.perfil-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.perfil-h h4{font-size:17px}
.ia{margin-top:6px;padding:12px;border-radius:12px;background:var(--sunk)}
.ia .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ia .fh{margin:0}
.sug{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}
.sug:first-of-type{margin-top:10px}
.sug p{margin:2px 0 0;color:var(--muted);font-size:14px}
.sug .why{font-size:13px;font-style:italic}
.cat{font-size:12px;color:var(--violet-ink);background:var(--violet-soft);padding:1px 8px;border-radius:999px;margin-left:6px;font-weight:600}
.done{font-size:13px;color:var(--ok);font-weight:600;white-space:nowrap;padding-top:6px}
.msg{font-size:14px;color:var(--muted);margin-top:8px}
.msg.err{color:var(--warn)}
.asig{padding:14px 0;border-top:1px solid var(--line)}
.asig h4{font-size:16px;margin-bottom:10px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.ck{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 8px;font-size:14px;cursor:pointer;background:var(--surface)}

.ck:has(input:checked){border-color:var(--violet);background:var(--violet-soft);color:var(--violet-ink);font-weight:600}

.beh-grid{display:grid;grid-template-columns:repeat(var(--n),minmax(170px,1fr));gap:8px}
.bc{display:flex;flex-direction:column;gap:4px}
.bcl{font-size:12.5px;font-weight:600;padding:4px 8px;border-radius:6px}

}

}

function iaPerfil(p){
  if(!G.iaPerfil||!sampleFn)return "";
  const s=sug[p.id];
  let body="";
  if(s&&s.loading)body=`<p class="msg">Analizando el perfil…</p>`;
  else if(s&&s.error)body=`<p class="msg err">${esc(s.error)}</p>`;
  else if(s&&s.items)body=s.items.map((it,j)=>`<div class="sug"><div><b>${esc(it.nombre)}</b><span class="cat">${esc(it.categoria||"")}</span><p>${esc(it.descripcion)}</p>${it.motivo?`<p class="why">${esc(it.motivo)}</p>`:""}</div>${it.added?'<span class="done">Agregada</span>':`<button class="btn sm" data-act="acceptSug" data-id="${p.id}" data-j="${j}">Agregar</button>`}</div>`).join("");
  return `<div class="ia"><div class="row"><button class="btn ia-btn sm" data-act="iaComps" data-id="${p.id}"${s&&s.loading?" disabled":""}>Sugerir competencias con IA</button><span class="fh">Se basa en la descripción y responsabilidades que capturaste.</span></div>${body}</div>`;
}

function readiness(){const nv=S.marco.niveles, cs=named(), ps=perfilesN(); const items=[];
  const nm=(n,j)=>(j+1)+". "+lvName(n,j); const hib=isHib(); const NA="se define en tu sesión con el equipo de AS";
  {const det=[];const md=curModel();
   if(!md)det.push("Elige el tipo de modelo de competencias.");
   else if(hib){const n=(S.modelo.idea||"").trim().length;if(n<MIN_DESC)det.push(`Describe tu primera idea del modelo: necesita al menos ${MIN_DESC} caracteres (lleva ${n}).`);}
   items.push({ok:!det.length,b:"modelo",t:hib?"Tipo de modelo elegido y tu primera idea descrita":"Tipo de modelo elegido",det});}
  // 1. Marco
  {const det=[];const withName=nv.filter(n=>n.nombre.trim()).length;
   if(withName<3)det.push(`Tienes ${withName} ${withName===1?"nivel":"niveles"} con nombre; necesitas al menos 3.`);
   nv.forEach((n,j)=>{const a=n.nombre.trim(),d=n.desc.trim();
     if(!a&&!d)det.push(`El nivel ${j+1} está vacío: complétalo o quítalo con la ×.`);
     else if(!a)det.push(`Nivel ${j+1}: falta el nombre.`);
     else if(!d)det.push(`${nm(n,j)}: falta la definición.`);});
   items.push(hib?{ok:true,na:true,t:"Marco con niveles: "+NA}:{ok:!det.length,b:"marco",t:"Marco con al menos 3 niveles, todos con nombre y definición",det});}
  // 2. Competencias
  {const det=[];if(cs.length<2)det.push(`Tienes ${cs.length} ${cs.length===1?"competencia":"competencias"} con nombre; necesitas al menos 2.`);
   cs.forEach(c=>{const f=[];if(!c.cat.trim())f.push("la categoría");if(!c.desc.trim())f.push("la definición");if(f.length)det.push(`${c.nombre}: falta ${f.join(" y ")}.`);});
   const sin=S.competencias.filter(c=>!c.nombre.trim()&&(c.desc.trim()||c.cat.trim())).length;
   if(sin)det.push(`${sin===1?"Hay 1 competencia":"Hay "+sin+" competencias"} sin nombre que no se toma${sin===1?"":"n"} en cuenta: escribe su nombre o quítala${sin===1?"":"s"}.`);
   items.push({ok:cs.length>=2&&!det.length,b:"competencias",t:"Al menos 2 competencias, cada una con categoría y definición",det});}
  // 3. Perfiles
  {const det=[];if(!ps.length)det.push("Captura al menos un perfil con su nombre.");
   ps.forEach(p=>{const n=p.desc.trim().length;if(n<MIN_DESC)det.push(`${p.puesto}: la descripción del perfil necesita al menos ${MIN_DESC} caracteres (lleva ${n}).`);});
   S.perfiles.forEach((p,i)=>{if(!p.puesto.trim()&&(p.desc.trim()||p.resp.trim()||p.area.trim()))det.push(`El perfil ${i+1} no tiene nombre y no se toma en cuenta: escribe su nombre o quita el perfil.`);});
   items.push({ok:ps.length>0&&!det.length,b:"perfiles",t:`Cada perfil con nombre y una descripción de al menos ${MIN_DESC} caracteres`,det});}
  // 4. Asignación
  {const det=[];if(!ps.length)det.push("Primero captura tus perfiles.");
   ps.forEach(p=>{const k=p.comps.filter(id=>cs.some(c=>c.id===id)).length;const f=[];
     if(!hib&&(p.nivel===""||!nv[+p.nivel]))f.push("elegir el nivel esperado");
     if(k<2)f.push(`seleccionar al menos 2 competencias (lleva ${k})`);
     if(f.length)det.push(`${p.puesto}: falta ${f.join(" y ")}.`);});
   items.push({ok:ps.length>0&&!det.length,b:"asignacion",t:hib?"Cada perfil con al menos 2 competencias seleccionadas (el nivel esperado "+NA+")":"Cada perfil con nivel esperado y al menos 2 competencias seleccionadas",det});}
  // 5. Comportamientos
  const total=cs.length*nv.length; const filled=cs.reduce((a,c)=>a+nv.filter((_,j)=>((c.beh||[])[j]||"").trim()).length,0);
  {const det=[];if(!cs.length)det.push("Primero captura tus competencias.");
   cs.forEach(c=>{const miss=nv.map((n,j)=>[n,j]).filter(([n,j])=>!((c.beh||[])[j]||"").trim()).map(([n,j])=>nm(n,j));
     if(miss.length)det.push(`${c.nombre}: ${miss.length===1?"falta el nivel":"faltan los niveles"} ${miss.join(", ")}.`);});
   items.push(hib?{ok:true,na:true,t:"Comportamientos por nivel: "+NA}:{ok:total>0&&filled===total,b:"comportamientos",t:`Comportamientos escritos en todos los niveles de cada competencia (${filled} de ${total})`,part:total?filled/total:0,det});}
  // 6. Usuarios
  {const ok=S.usuarios.some(u=>u.nombre.trim());
   items.push({ok,b:"usuarios",t:"Al menos un usuario de prueba con nombre",det:ok?[]:[S.usuarios.length?"Escribe el nombre de al menos uno de tus usuarios de prueba.":"Agrega al menos un usuario de prueba."]});}
  const sc=items.filter(i=>!i.na);const score=sc.reduce((a,i)=>a+(i.ok?1:(i.part||0)),0)/sc.length;
  return {items,score,filled,total};}

B.resumen=()=>{const r=readiness();const pct=Math.round(r.score*100);
  return head("resumen")+`<div class="ready-top"><b>${pct} %</b><div class="track"><i style="width:${pct}%"></i></div></div>

B.revision=()=>{

  let body="";

  return head("revision")+`<button class="btn ia-btn" data-act="iaReview"${review&&review.loading?" disabled":""}>Revisar mi matriz con IA</button>${body}`;};

let cur=0;
function renderAgenda(){document.getElementById("agenda").innerHTML=G.steps.map((s,i)=>`<li><button data-act="go" data-i="${i}"${i===cur?' aria-current="step"':""}><span class="n">${i===0?"0":i}</span><span>${s.t}<span class="m">${s.min}</span></span></button></li>`).join("");}
function renderStep(){const s=G.steps[cur];const last=G.steps.length-1;
  const kick=cur===0?"Preparación, antes de la sesión":`Paso ${cur} de ${last}, ${s.min}`;
  let h=`<article class="step"><p class="kick">${kick}</p><h2>${s.t}</h2><div class="prose"><p class="lead">${s.lead}</p>${s.html||""}</div>`;
  (s.blocks||[]).filter(b=>b!=="revision"||sampleFn).forEach(b=>{h+=`<section class="wb" data-block="${b}">${B[b]()}</section>`;});
  if(s.after)h+=`<div class="prose">${s.after}</div>`;
  if(s.tip)h+=`<aside class="tip"><span class="blob" aria-hidden="true"></span><div><h4>Recomendación lapzo</h4><p>${s.tip}</p></div></aside>`;
  if(s.fac)h+=`<details class="fac"><summary>Notas para quien facilita</summary>${s.fac}</details>`;
  h+=`<nav class="nav" aria-label="Navegación entre pasos">${cur>0?`<button class="btn" data-act="go" data-i="${cur-1}">Anterior: ${G.steps[cur-1].t}</button>`:"<span></span>"}${cur<last?`<button class="btn primary" data-act="go" data-i="${cur+1}">Siguiente: ${G.steps[cur+1].t}</button>`:""}</nav></article>`;

  else if(S.usuarios.some(u=>(u.nombre||"").trim()&&!(u.correo||"").trim()))mm.push("Algunos usuarios de prueba no tienen correo; en su lugar se usa su nombre. Para la carga, Lapzo necesita el correo o usuario.");
  const dd=S.diag;if(![dd.preguntas,dd.aprobacion,dd.intentos,dd.tiempo,dd.inicio,dd.fin,dd.directo,dd.feedback].some(v=>String(v||"").trim()))dg.push("Aún no definiste la configuración de tu diagnóstico; la hoja Diagnóstico irá casi vacía.");
  if(String(dd.aprobacion||"").trim()&&!(+dd.aprobacion>=1&&+dd.aprobacion<=100))dg.push("El porcentaje mínimo debe estar entre 1 y 100.");
  if(!Object.values(S.cierre).some(v=>String(v||"").trim()))dg.push("Aún no registraste bloqueos ni siguiente paso; la hoja Próximos pasos irá vacía.");
  return {mm,dg};}
function fillSheet(ws,startRow,rows){if(!ws)return;
  for(let r=startRow;r<=Math.max(ws.rowCount,startRow);r++){const row=ws.getRow(r);row.eachCell({includeEmpty:false},c=>{c.value=null;});}
  rows.forEach((vals,i)=>{const row=ws.getRow(startRow+i);vals.forEach((v,k)=>{row.getCell(k+1).value=(v===""?null:v);});row.commit();});}
async function buildFromTemplate(b64,fill){const wb=new ExcelJS.Workbook();await wb.xlsx.load(b64buf(b64));fill(wb);return await wb.xlsx.writeBuffer();}
function sheetjsFallback(sheets){const wb=XLSX.utils.book_new();sheets.forEach(([name,aoa])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoa),name));return XLSX.write(wb,{bookType:"xlsx",type:"array"});}
async function exportMM(){const L=loadRows();let buf;
  try{
    if(window.ExcelJS)buf=await buildFromTemplate(TPL_MM,wb=>{fillSheet(wb.getWorksheet("Competencias"),2,L.comp);fillSheet(wb.getWorksheet("Marcos"),2,L.marcos);fillSheet(wb.getWorksheet("Matrices"),2,L.matrices);fillSheet(wb.getWorksheet("Asignación de usuarios"),2,L.asig);});
    else if(window.XLSX)buf=sheetjsFallback([["Competencias",[["Categoría (opcional)","Nombre Competencia","Descripción"]].concat(L.comp)],["Marcos",[["Marco","Descripción","Nivel","Indice Nivel","Subnivel (opcional)","Indice Subnivel (opcional)"]].concat(L.marcos)],["Matrices",[["Matriz","Marco","Competencia","Nivel","Subnivel (opcional)","Comportamiento"]].concat(L.matrices)],["Asignación de usuarios",[["Marco","Matriz","Nivel","Subnivel (si aplica)","Usuario/Colaborador"]].concat(L.asig)]]);
    else throw new Error("nolib");
  }catch(e){dlMsg="No se pudo preparar el archivo en esta vista. Usa Ver como texto y copia el contenido.";rerenderBlock("descarga");return;}
  await saveBuf(buf,saveName("Plantilla Marcos y Matrices"),"Listo: tu modelo se descargó en el formato Plantilla Marcos y Matrices.");}
function dgSheets(){const nv=S.marco.niveles,cs=named(),ps=perfilesN();const comp=id=>(cs.find(c=>c.id===id)||{}).nombre;
  const lvl=p=>p&&p.nivel!==""&&nv[+p.nivel]?((+p.nivel+1)+". "+lvName(nv[+p.nivel],+p.nivel)):"";
  const blocks=[4,5].flatMap(i=>(G.steps[i]&&G.steps[i].blocks)||[]);const out=[];
  out.push(["Datos de la sesión",["Elemento","Detalle"],[["Empresa",S.org.empresa],["Responsable",S.org.responsable],["Fecha de la sesión",fmtDate(S.org.fecha)],["Guía",G.title],["Tipo de modelo",(curModel()||{}).n||""],["Marco",S.marco.nombre],["Matriz",S.matriz.nombre]],[28,70]]);
  blocks.forEach(b=>{
    if(b==="asignacion")out.push(["Asignación por perfil",["Matriz","Perfil","Tipo de perfil","Nivel esperado","Competencias a evaluar"],ps.map(p=>[matrizName(),p.puesto,ptLabel(p),isHib()?"Se define en la sesión con el equipo de AS":lvl(p),p.comps.map(comp).filter(Boolean).join("; ")]),[24,28,24,24,60]]);
    if(b==="usuarios")out.push(["Usuarios de prueba",["Nombre","Correo o usuario","Perfil","Nivel esperado"],S.usuarios.filter(u=>(u.nombre||"").trim()||(u.correo||"").trim()).map(u=>{const p=S.perfiles.find(x=>x.id===u.perfil);return [u.nombre,u.correo,p?p.puesto:"",lvl(p)];}),[28,32,28,24]]);
    if(b==="diagnostico"){const d=S.diag;const sel=d.comps.map(comp).filter(Boolean);
      out.push(["Diagnóstico",["Elemento","Decisión"],[["Matriz",matrizName()],["Competencias a evaluar",sel.length?sel.join("; "):"Sin seleccionar"],["Banco de preguntas",{ia:"Generado con LIA y revisado",manual:"Manual",mixto:"Mixto"}[d.banco]||""],["Preguntas por nivel",numOr(d.preguntas)],["Porcentaje mínimo por nivel",numOr(d.aprobacion)],["Intentos disponibles",numOr(d.intentos)],["Tiempo límite (minutos)",numOr(d.tiempo)],["Fecha de inicio",fmtDate(d.inicio)],["Fecha de cierre",fmtDate(d.fin)],["Diagnóstico directo al nivel",d.directo],["Feedback para el colaborador",d.feedback]],[32,70]]);}
    if(b==="resumen"){const r=readiness();out.push(["Estado del insumo",["Punto","Estado","Qué falta"],r.items.map(i=>[i.t,i.na?"Se define en la sesión con el equipo de AS":i.ok?"Listo":"Pendiente",(i.det||[]).join(" ")]).concat([["Avance total",Math.round(r.score*100)+" %",""]]),[60,26,70]]);}
    if(b==="cierre"){const c=S.cierre;out.push(["Próximos pasos",["Elemento","Detalle"],[["Momento más complejo",c.momento],["Tipo de bloqueo",c.tipo],["¿Qué te detiene?",c.bloqueo],["Solución propuesta",c.solucion],["Siguiente paso",c.paso],["Responsable",c.responsable],["Fecha compromiso",fmtDate(c.fecha)],["Requiere sesión 1:1 con Lapzo",c.unoauno]],[30,70]]);}
  });
  return out;}
async function exportDG(){const sh=dgSheets();let buf;
  try{
    if(window.ExcelJS){const wb=new ExcelJS.Workbook();
      sh.forEach(([name,hdr,rows,w])=>{const ws=wb.addWorksheet(name);ws.columns=w.map(x=>({width:x}));
        const h=ws.addRow(hdr);h.eachCell(c=>{c.font={bold:true,color:{argb:"FFFFFFFF"}};c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FF6B3FF2"}};c.alignment={vertical:"middle",wrapText:true};});
        rows.forEach(r=>{const row=ws.addRow(r.map(v=>v===""?null:v));row.eachCell(c=>{c.alignment={vertical:"top",wrapText:true};});});
        ws.views=[{state:"frozen",ySplit:1}];});
      buf=await wb.xlsx.writeBuffer();}
    else if(window.XLSX)buf=sheetjsFallback(sh.map(([name,hdr,rows])=>[name,[hdr].concat(rows)]));
    else throw new Error("nolib");
  }catch(e){dlMsg="No se pudo preparar el archivo en esta vista. Usa Ver como texto y copia el contenido.";rerenderBlock("descarga");return;}
  await saveBuf(buf,saveName("Diagnóstico y próximos pasos"),"Listo: tu diagnóstico y próximos pasos se descargaron en Excel.");}
function asText(){const R=rows();return SHEETS.map(([k,name])=>name.toUpperCase()+"\n"+R[k].map(r=>r.join("\t")).join("\n")).join("\n\n");}

/* ---------- example ---------- */
function example(){const s=blank();s.modo=S.modo;s.modelo={tipo:"dominio",idea:"",nivelesIdea:""};s.org=Object.assign({},S.org);
  s.org.empresa=s.org.empresa||"Empresa de ejemplo";
  s.marco={nombre:"Marco de dominio comercial",niveles:PRESETS.dominio.niveles.map(n=>Object.assign({},n))};
  const C=(n,cat,d,b)=>({id:uid(),nombre:n,cat,desc:d,beh:b});
  const cli=C("Orientación al cliente","Organizacionales","Entiende las necesidades del cliente y actúa para generar soluciones que le den valor y construyan relaciones de largo plazo.",["Atiende las solicitudes del cliente en tiempo y forma siguiendo los procesos establecidos.","Identifica necesidades del cliente más allá de la solicitud inicial y propone alternativas.","Anticipa problemas del cliente y diseña soluciones que mejoran su experiencia.","Define estándares de servicio para el área y forma a otros en la atención al cliente."]);
  const neg=C("Negociación","Técnicas","Logra acuerdos que benefician a ambas partes cuidando la rentabilidad y la relación.",["Presenta la oferta estándar y escala las objeciones a su líder.","Maneja las objeciones comunes y cierra acuerdos dentro de los márgenes autorizados.","Negocia condiciones complejas o de alto valor protegiendo el margen.","Diseña estrategias de negociación para cuentas clave y entrena al equipo en ellas."]);
  const res=C("Orientación a resultados","Organizacionales","Se compromete con metas retadoras y da seguimiento constante hasta lograrlas.",["Cumple las metas asignadas con el seguimiento de su líder.","Da seguimiento propio a su avance y corrige el rumbo cuando se desvía.","Supera sus metas de forma consistente y ayuda a otros a cumplir las suyas.","Define las metas del área y crea mecanismos que elevan el desempeño de todos."]);
  const lid=C("Liderazgo de equipos","Liderazgo","Guía, motiva y desarrolla a su equipo para alcanzar los objetivos.",["Comparte información y prioridades con su equipo de forma clara.","Asigna responsabilidades, da retroalimentación y reconoce los logros.","Desarrolla a las personas de su equipo con planes concretos y maneja los conflictos.","Forma nuevos líderes y construye una cultura de alto desempeño."]);
  const pla=C("Planeación comercial","Técnicas","Organiza su cartera, pronósticos y actividades de venta para cumplir los objetivos del periodo.",["Registra sus actividades y oportunidades en el CRM.","Planea su semana con base en su embudo y prioriza oportunidades.","Elabora pronósticos confiables y planes de trabajo por cuenta.","Define la estrategia comercial del territorio y asigna los recursos."]);
  s.competencias=[cli,neg,res,lid,pla];
  const P=(o)=>Object.assign(newPerfil(),{tipo:"puesto"},o);
  s.perfiles=[
    P({puesto:"Ejecutivo de ventas",area:"Comercial",reporta:"Supervisor de ventas",contribucion:"Contribuidor individual",equipo:"No",desc:"Genera y cierra oportunidades de venta con clientes PyME de su territorio para cumplir su cuota mensual.",resp:"Prospectar clientes nuevos\nPresentar propuestas comerciales\nNegociar y cerrar ventas\nDar seguimiento en el CRM",nivel:"1",comps:[cli.id,neg.id,res.id,pla.id]}),
    P({puesto:"Supervisor de ventas",area:"Comercial",reporta:"Gerente comercial",contribucion:"Coordinación",equipo:"Sí",desc:"Coordina a un equipo de seis ejecutivos para asegurar el cumplimiento de la cuota del equipo y la calidad de la atención.",resp:"Dar seguimiento diario al embudo del equipo\nAcompañar a ejecutivos en negociaciones clave\nRetroalimentar y desarrollar al equipo",nivel:"2",comps:[cli.id,neg.id,res.id,lid.id,pla.id]}),
    P({puesto:"Gerente comercial",area:"Comercial",reporta:"Dirección general",contribucion:"Gerencia",equipo:"Sí",desc:"Dirige la estrategia comercial de la región, define metas y desarrolla a los supervisores de su equipo.",resp:"Definir la estrategia y las metas de la región\nNegociar con cuentas clave\nDesarrollar a los supervisores",nivel:"3",comps:[cli.id,res.id,lid.id,pla.id,neg.id]})];
  s.matriz={nombre:"Matriz Comercial"};
  S=s;Object.keys(sug).forEach(k=>delete sug[k]);Object.keys(behAI).forEach(k=>delete behAI[k]);review=null;dlMsg="";save();}

/* ---------- events ---------- */
document.addEventListener("input",e=>{const t=e.target;if(!t.dataset||!t.dataset.k)return;setPath(t.dataset.k,t.value);save();renderLive();
  const c=document.querySelector(`[data-cnt="${t.dataset.k}"]`);if(c){const n=t.value.trim().length,m=+c.dataset.min;c.className="cnt "+(n>=m?"good":"bad");c.textContent=n>=m?`Listo: ${n} caracteres`:`Llevas ${n} de ${m} caracteres mínimos`;}});
document.addEventListener("change",e=>{const t=e.target;
  if(t.dataset.act==="toggleComp"){const p=S.perfiles[+t.dataset.p];const id=t.dataset.c;if(t.checked){if(!p.comps.includes(id))p.comps.push(id);}else p.comps=p.comps.filter(x=>x!==id);save();rerenderOthers(t);renderLive();return;}
  if(t.dataset.act==="toggleDiag"){const id=t.dataset.c;if(t.checked){if(!S.diag.comps.includes(id))S.diag.comps.push(id);}else S.diag.comps=S.diag.comps.filter(x=>x!==id);save();return;}
  if(t.dataset.act==="prep"){S.prep[t.dataset.v]=t.checked;save();return;}
  if(t.dataset.k&&t.dataset.r){rerenderOthers(t);if(/^perfiles\.\d+\.tipo$/.test(t.dataset.k))rerenderOf(t);}});
function arm(btn,fn){if(btn.dataset.armed){delete btn.dataset.armed;btn.textContent=btn.dataset.label;fn();return;}
  btn.dataset.armed="1";btn.textContent="Toca otra vez para confirmar";setTimeout(()=>{if(btn.dataset.armed){delete btn.dataset.armed;btn.textContent=btn.dataset.label;}},3500);}
const hasData=()=>S.competencias.length||S.perfiles.some(p=>p.puesto.trim()||p.desc.trim())||S.marco.niveles.some(n=>n.nombre.trim());
document.addEventListener("click",e=>{const b=e.target.closest("button[data-act]");if(!b)return;const a=b.dataset.act;
  switch(a){
    case "go":go(+b.dataset.i,true);break;
    case "modo":S.modo=b.dataset.v;if(S.modo==="sesion"&&S.perfiles.length>3){/* keep data, just limit adding */}save();renderMode();rerenderAll();break;
    case "example":if(hasData())arm(b,()=>{example();applyModelClass();renderMode();go(cur);});else{example();applyModelClass();renderMode();go(cur);}break;
    case "reset":arm(b,()=>{const m=S.modo;S=blank();S.modo=m;review=null;dlMsg="";showText=false;save();applyModelClass();go(0,true);});break;
    case "setModelo":{S.modelo=S.modelo||{tipo:"",idea:"",nivelesIdea:""};S.modelo.tipo=b.dataset.v;
      if(!S.marco.niveles.some(n=>n.nombre.trim()||n.desc.trim()))applyModelLevels();
      applyModelClass();save();rerenderAll();break;}
    case "modelLevels":{const go2=()=>{applyModelLevels();save();rerenderAll();};
      if(S.marco.niveles.some(n=>n.nombre.trim()||n.desc.trim())||S.competencias.some(c=>(c.beh||[]).some(x=>(x||"").trim())))arm(b,go2);else go2();break;}
    case "preset":{const p=PRESETS[b.dataset.v];S.marco.niveles=p.niveles.map(n=>Object.assign({},n));if(!S.marco.nombre.trim())S.marco.nombre=p.nombre;save();rerenderAll();break;}
    case "addNivel":S.marco.niveles.push({nombre:"",desc:""});save();rerenderAll();break;
    case "delNivel":{const i=+b.dataset.i;S.marco.niveles.splice(i,1);S.competencias.forEach(c=>{if(Array.isArray(c.beh))c.beh.splice(i,1);});S.perfiles.forEach(p=>{if(p.nivel!==""){const n=+p.nivel;if(n===i)p.nivel="";else if(n>i)p.nivel=String(n-1);}});save();rerenderAll();break;}
    case "addComp":S.competencias.push({id:uid(),nombre:"",cat:"",desc:"",beh:[]});save();rerenderAll();{const ins=document.querySelectorAll('[data-block="competencias"] .comp-top input');if(ins.length)ins[ins.length-2].focus();}break;
    case "addLib":{const l=LIB.find(x=>x[0]===b.dataset.n);if(l){S.competencias.push({id:uid(),nombre:l[0],cat:l[1],desc:l[2],beh:[]});save();rerenderAll();}break;}
    case "delComp":{const c=S.competencias.splice(+b.dataset.i,1)[0];if(c){S.perfiles.forEach(p=>p.comps=p.comps.filter(x=>x!==c.id));S.diag.comps=S.diag.comps.filter(x=>x!==c.id);}save();rerenderAll();break;}
    case "addPerfil":if(S.perfiles.length<maxPerfiles()){S.perfiles.push(newPerfil());save();rerenderAll();}break;
    case "delPerfil":{const p=S.perfiles.splice(+b.dataset.i,1)[0];if(p)S.usuarios.forEach(u=>{if(u.perfil===p.id)u.perfil="";});save();rerenderAll();break;}
    case "addUser":S.usuarios.push({nombre:"",correo:"",perfil:""});save();rerenderAll();break;
    case "delUser":S.usuarios.splice(+b.dataset.i,1);save();rerenderAll();break;
    case "iaComps":if(sampleFn)iaComps(b.dataset.id);break;
    case "acceptSug":acceptSug(b.dataset.id,+b.dataset.j);break;
    case "iaBeh":if(sampleFn)iaBeh(b.dataset.id);break;
    case "iaReview":if(sampleFn)iaReview();break;
    case "export":exportX();break;
    case "exportMM":exportMM();break;
    case "exportDG":exportDG();break;
    case "text":showText=!showText;rerenderBlock("descarga");break;
  }});

go(m?+m[1]:0,false);
})();
